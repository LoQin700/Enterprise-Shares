name: Fix Enterprise Shares Shopify Sync State

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-es-shopify-sync-state.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch schema, saved settings, header instance and CSS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load_json_with_preamble(path):
              text = path.read_text(encoding='utf-8')
              start = text.find('{')
              return text[:start], json.loads(text[start:])

          def save_json_with_preamble(path, preamble, data):
              path.write_text(preamble + json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Global theme schema.
          schema_path = Path('config/settings_schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          group = next(item for item in schema if item.get('name') == '全局产品卡')
          settings = group['settings']

          remove_info_ids = {
              'es_mf_namespace', 'es_deadline_key', 'es_desc_key',
              'es_author_key', 'es_tags_key', 'es_location_key'
          }
          for setting in settings:
              if setting.get('id') in remove_info_ids:
                  setting.pop('info', None)

          accent_ids = {'es_media_accent_enable', 'es_media_accent_height'}
          settings[:] = [setting for setting in settings if setting.get('id') not in accent_ids]
          hover_index = next(i for i, setting in enumerate(settings) if setting.get('id') == 'es_hover_second_image')
          settings[hover_index + 1:hover_index + 1] = [
              {
                  'type': 'checkbox',
                  'id': 'es_media_accent_enable',
                  'label': '显示图片底部主题色条',
                  'default': True
              },
              {
                  'type': 'range',
                  'id': 'es_media_accent_height',
                  'label': '主题色条高度',
                  'min': 2,
                  'max': 12,
                  'step': 1,
                  'unit': 'px',
                  'default': 6
              }
          ]
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Persist runtime global values so existing themes do not rely on defaults.
          data_path = Path('config/settings_data.json')
          preamble, data = load_json_with_preamble(data_path)
          current = data.setdefault('current', {})
          current.update({
              'es_cards_enable': True,
              'es_card_ratio': current.get('es_card_ratio', '16/9'),
              'es_card_title_size': current.get('es_card_title_size', 16),
              'es_card_description_size': current.get('es_card_description_size', 14),
              'es_hover_second_image': current.get('es_hover_second_image', False),
              'es_media_accent_enable': True,
              'es_media_accent_height': current.get('es_media_accent_height', 6),
              'es_wishlist_enable': current.get('es_wishlist_enable', True)
          })
          save_json_with_preamble(data_path, preamble, data)

          # Explicitly activate the new header settings in the existing Header instance.
          header_path = Path('sections/header-group.json')
          preamble, header_group = load_json_with_preamble(header_path)
          header = header_group['sections']['header_section']
          header_settings = header.setdefault('settings', {})
          header_settings.update({
              'logo_position': 'left',
              'menu_position': 'center',
              'menu_row': 'bottom',
              'show_search': True,
              'es_kickstarter_layout': True,
              'es_full_search': True,
              'es_search_placeholder': 'Search projects, creators, and categories',
              'es_search_max_width': 840,
              'es_mobile_menu_font_size': 16,
              'search_position': 'center',
              'search_row': 'top'
          })
          menu_settings = header['blocks']['header-menu'].setdefault('settings', {})
          for stale_key in (
              'menu_style', 'featured_products_aspect_ratio',
              'featured_collections_aspect_ratio', 'image_border_radius'
          ):
              menu_settings.pop(stale_key, None)
          save_json_with_preamble(header_path, preamble, header_group)

          # Make the media accent and plain arrow controls visually unambiguous.
          css_path = Path('assets/es-project-card-overrides.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* ES 20260726 card frame and media accent */'
          if marker in css:
              css = css.split(marker)[0].rstrip() + '\n\n'
          css += r'''/* ES 20260726 card frame and media accent */
          .es-card {
            border: 1px solid var(--color-border);
            border-radius: 10px;
            overflow: visible;
            background: var(--color-background);
          }

          .es-card:hover,
          .es-card:focus-within {
            border-color: var(--color-primary, var(--color-primary-button-background));
          }

          .es-card__media {
            width: calc(100% - 10px);
            margin: 5px 5px 0;
            border-radius: 8px;
          }

          .es-card__media-link {
            position: relative;
            overflow: hidden;
            border-radius: inherit;
          }

          .es-card__media-link::after {
            content: '';
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 20;
            display: block;
            height: var(--es-media-accent-height, 6px);
            border-radius: 0 0 8px 8px;
            background-color: var(--color-primary, var(--color-primary-button-background, currentColor));
            pointer-events: none;
          }

          .es-featured-section .es-slider-arrow,
          .es-featured-section .es-slider-arrow:hover:not(:disabled),
          .es-featured-section .es-slider-arrow:focus-visible:not(:disabled),
          .es-featured-section .es-slider-arrow:disabled,
          .es-product-carousel .es-slider-arrow,
          .es-product-carousel .es-slider-arrow:hover:not(:disabled),
          .es-product-carousel .es-slider-arrow:focus-visible:not(:disabled),
          .es-product-carousel .es-slider-arrow:disabled {
            width: 28px !important;
            height: 28px !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            color: var(--color-primary, var(--color-primary-button-background)) !important;
            background: transparent !important;
            box-shadow: none !important;
          }

          .es-featured-section .es-slider-arrow:hover:not(:disabled),
          .es-featured-section .es-slider-arrow:focus-visible:not(:disabled),
          .es-product-carousel .es-slider-arrow:hover:not(:disabled),
          .es-product-carousel .es-slider-arrow:focus-visible:not(:disabled) {
            color: var(--color-primary-hover, var(--color-primary-button-hover-background)) !important;
          }
          '''
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Validate JSON and JavaScript
        run: |
          python -m json.tool config/settings_schema.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ('config/settings_data.json', 'sections/header-group.json'):
              text = Path(filename).read_text(encoding='utf-8')
              json.loads(text[text.find('{'):])
          PY
          node --check assets/es-header.js
          node --check assets/es-section-carousel.js
      - name: Remove workflow and commit fix
        run: |
          rm .github/workflows/fix-es-shopify-sync-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore synced card and header settings [skip ci]"
          git push
