name: Optimize product page stability

on:
  push:
    branches:
      - perf/product-page-stability

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/product-page-stability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply product page optimizations
        run: python .github/scripts/optimize_product_page.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('templates/product.json')]:
              text = path.read_text(encoding='utf-8')
              start = text.find('{')
              json.loads(text[start:])
              print(f'Valid JSON: {path}')
          PY

      - name: Shopify CLI Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error

      - name: Commit optimized theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/optimize-product-page.yml .github/scripts/optimize_product_page.py
          git add templates/product.json snippets/product-media-gallery-content.liquid sections/es-product-project-tabs.liquid
          git commit -m "Optimize product page loading stability"
          git push origin HEAD:perf/product-page-stability
