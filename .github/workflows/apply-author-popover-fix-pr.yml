name: Apply Author Popover Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-author-popover-fix-pr.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update author popover logic and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          snippet = r'''{%- liquid
            assign name_key = settings.es_author_name_key | default: 'display_name'
            assign avatar_key = settings.es_author_avatar_key | default: 'avatar'
            assign bio_key = settings.es_author_bio_key | default: 'bio'
            assign projects_key = settings.es_author_collection_key | default: 'projects_collection'
            assign joined_key = settings.es_author_joined_key | default: 'joined_date'

            assign author_name_field = author[name_key]
            assign author_avatar_field = author[avatar_key]
            assign author_bio_field = author[bio_key]
            assign author_projects_field = author[projects_key]
            assign author_joined_field = author[joined_key]

            if author_joined_field == blank
              assign author_joined_field = author['Date']
            endif
            if author_joined_field == blank
              assign author_joined_field = author['date']
            endif
            if author_joined_field == blank
              assign author_joined_field = author['joined_date']
            endif

            assign author_name = author_name_field.value | default: author.system.handle
            assign author_avatar = author_avatar_field.value
            assign author_bio = author_bio_field.value
            assign author_url = author.system.url

            assign author_projects = blank
            assign author_collection = blank
            assign project_count = 0
            assign project_link = blank

            if author_projects_field != blank
              assign projects_value = author_projects_field.value

              if author_projects_field.type contains 'list.'
                assign author_projects = projects_value
                assign project_count = author_projects.size
              elsif author_projects_field.type == 'collection_reference'
                assign author_collection = projects_value
                assign project_count = author_collection.products_count
                assign project_link = author_collection.url
              elsif projects_value.products_count != blank
                assign author_collection = projects_value
                assign project_count = author_collection.products_count
                assign project_link = author_collection.url
              else
                assign author_projects = projects_value
                assign project_count = author_projects.size
              endif
            endif
          -%}

          <div class="es-author" data-es-author>
            {%- if author_url != blank -%}<a href="{{ author_url }}" class="es-author__trigger">{%- else -%}<div class="es-author__trigger" tabindex="0">{%- endif -%}
              {%- if author_avatar -%}
                {{ author_avatar | image_url: width: 96 | image_tag: class: 'es-author__avatar', loading: 'lazy', alt: author_name }}
              {%- else -%}
                <span class="es-author__avatar es-author__avatar--fallback" aria-hidden="true">{{ author_name | slice: 0 | upcase }}</span>
              {%- endif -%}
            {%- if author_url != blank -%}</a>{%- else -%}</div>{%- endif -%}

            <div class="es-author__popover" role="dialog" aria-label="{{ author_name | escape }}">
              <div class="es-author__popover-head">
                {%- if author_avatar -%}
                  {{ author_avatar | image_url: width: 128 | image_tag: class: 'es-author__popover-avatar', loading: 'lazy', alt: author_name }}
                {%- endif -%}
                <div>
                  {%- if author_url != blank -%}
                    <a href="{{ author_url }}" class="es-author__name">{{ author_name }}</a>
                  {%- else -%}
                    <span class="es-author__name">{{ author_name }}</span>
                  {%- endif -%}
                  {%- if author_joined_field != blank -%}
                    <div class="es-author__joined">Joined {{ author_joined_field.value | date: '%B %Y' }}</div>
                  {%- endif -%}
                </div>
              </div>

              {%- if author_bio != blank -%}
                <div class="es-author__bio">{{ author_bio_field | metafield_tag }}</div>
              {%- endif -%}

              {%- if project_count > 0 -%}
                {%- if project_link != blank -%}
                  <a href="{{ project_link }}" class="es-author__count es-author__count--link">
                    <strong>{{ project_count }}</strong>
                    <span>Projects</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </a>
                {%- elsif author_projects != blank -%}
                  <details class="es-author__projects">
                    <summary class="es-author__count">
                      <strong>{{ project_count }}</strong>
                      <span>Projects</span>
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </summary>
                    <div class="es-author__project-list">
                      {%- for linked_product in author_projects limit: 12 -%}
                        <a href="{{ linked_product.url }}" class="es-author__project-link">{{ linked_product.title }}</a>
                      {%- endfor -%}
                    </div>
                  </details>
                {%- endif -%}
              {%- endif -%}
            </div>
          </div>
          '''

          Path('snippets/es-author-popover.liquid').write_text(snippet, encoding='utf-8')

          css_path = Path('assets/es-project-card.css')
          css = css_path.read_text(encoding='utf-8')

          start = css.index('.es-author {')
          end_marker = '''.es-author__count span {
            color: rgb(var(--color-foreground-rgb, 18 18 18) / 0.62);
            font-size: 1.2rem;
          }
          '''
          end = css.index(end_marker, start) + len(end_marker)

          replacement = r'''.es-author {
            position: relative;
            z-index: 1;
            width: 48px;
            height: 48px;
          }

          .es-author:hover,
          .es-author:focus-within {
            z-index: 60;
          }

          .es-author__trigger {
            display: block;
            width: 48px;
            height: 48px;
            color: inherit;
            text-decoration: none;
          }

          .es-author__avatar,
          .es-author__popover-avatar {
            display: block;
            width: 100%;
            height: 100%;
            border: 1px solid rgb(var(--color-foreground-rgb, 18 18 18) / 0.16);
            border-radius: 50%;
            object-fit: cover;
            background: var(--color-background, #fff);
          }

          .es-author__avatar--fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
          }

          .es-author__popover {
            position: absolute;
            left: 0;
            bottom: calc(100% + 6px);
            z-index: 60;
            width: min(320px, 84vw);
            padding: 16px;
            border: 1px solid rgb(var(--color-foreground-rgb, 18 18 18) / 0.14);
            border-radius: 10px;
            opacity: 0;
            visibility: hidden;
            color: var(--color-foreground, #121212);
            background: var(--color-background, #fff);
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.14);
            transform: translateY(6px);
            transition: opacity 180ms ease, visibility 180ms ease, transform 180ms ease;
            pointer-events: none;
          }

          .es-author__popover::after {
            position: absolute;
            right: 0;
            bottom: -12px;
            left: 0;
            height: 12px;
            content: '';
          }

          .es-author:hover .es-author__popover,
          .es-author:focus-within .es-author__popover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
          }

          .es-author__popover-head {
            display: grid;
            grid-template-columns: 54px 1fr;
            align-items: center;
            gap: 12px;
          }

          .es-author__popover-avatar {
            width: 54px;
            height: 54px;
          }

          .es-author__name {
            color: inherit;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
          }

          .es-author__name:hover,
          .es-author__name:focus-visible {
            text-decoration: underline;
            text-underline-offset: 3px;
          }

          .es-author__joined {
            margin-top: 3px;
            color: rgb(var(--color-foreground-rgb, 18 18 18) / 0.58);
            font-size: 1.2rem;
          }

          .es-author__bio {
            margin-top: 12px;
            font-size: 1.3rem;
            line-height: 1.5;
          }

          .es-author__bio p {
            margin: 0;
          }

          .es-author__projects {
            margin-top: 14px;
          }

          .es-author__projects > summary {
            list-style: none;
          }

          .es-author__projects > summary::-webkit-details-marker {
            display: none;
          }

          .es-author__count {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 6px;
            margin: 0;
            padding: 0;
            border: 0;
            color: inherit;
            background: transparent;
            font: inherit;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
          }

          .es-author__count strong {
            font-size: 2rem;
          }

          .es-author__count span {
            color: rgb(var(--color-foreground-rgb, 18 18 18) / 0.62);
            font-size: 1.2rem;
          }

          .es-author__count svg {
            width: 16px;
            height: 16px;
            margin-left: auto;
            transition: transform 180ms ease;
          }

          .es-author__projects[open] > .es-author__count svg {
            transform: rotate(90deg);
          }

          .es-author__count--link:hover,
          .es-author__count--link:focus-visible,
          .es-author__projects > summary:hover,
          .es-author__projects > summary:focus-visible {
            color: var(--color-primary, var(--color-foreground));
          }

          .es-author__project-list {
            max-height: 180px;
            margin-top: 10px;
            padding-top: 8px;
            overflow-y: auto;
            border-top: 1px solid rgb(var(--color-foreground-rgb, 18 18 18) / 0.12);
          }

          .es-author__project-link {
            display: block;
            padding: 7px 4px;
            border-radius: 5px;
            color: inherit;
            font-size: 1.2rem;
            line-height: 1.35;
            text-decoration: none;
          }

          .es-author__project-link:hover,
          .es-author__project-link:focus-visible {
            color: var(--color-primary, var(--color-foreground));
            background: rgb(var(--color-foreground-rgb, 18 18 18) / 0.05);
          }
          '''

          css_path.write_text(css[:start] + replacement + css[end:], encoding='utf-8')
          PY

      - name: Shopify CLI Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-author-popover-fix-pr.yml

      - name: Commit changes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support author project lists and stable popovers [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
