name: Validate FAQ and Creator Tabs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    if: github.head_ref == 'fix/faq-text-list-and-creator-card'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shopify CLI Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error
