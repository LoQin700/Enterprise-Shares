name: Apply Enterprise Header Cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-remove-sticky-dividers-pr.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove sticky option and header divider lines
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          section_path = Path('sections/enterprise-shares-header.liquid')
          source_lines = section_path.read_text(encoding='utf-8').splitlines()
          output = []
          skip_sticky_css = False

          for line in source_lines:
              if '.esh--sticky {' in line:
                  skip_sticky_css = True
                  continue

              if skip_sticky_css:
                  if line.strip() == '}':
                      skip_sticky_css = False
                  continue

              line = line.replace(
                  '{% if section.settings.sticky_header %} esh--sticky{% endif %}',
                  '',
              )

              if '"id": "sticky_header"' in line:
                  if output and output[-1].rstrip().endswith(','):
                      output[-1] = output[-1].rstrip()[:-1]
                  continue

              stripped = line.strip()
              if stripped in {
                  'border-top: 1px solid var(--color-border);',
                  'border-bottom: 1px solid var(--color-border);',
                  'border-right: 1px solid var(--color-border);',
              }:
                  continue

              output.append(line)

          text = '\n'.join(output) + '\n'
          if 'section.settings.sticky_header' in text or '"id": "sticky_header"' in text or '.esh--sticky' in text:
              raise RuntimeError('Sticky Header code or setting still remains')

          section_path.write_text(text, encoding='utf-8')

          group_path = Path('sections/header-group.json')
          group = json.loads(group_path.read_text(encoding='utf-8'))
          for section in group.get('sections', {}).values():
              if section.get('type') == 'enterprise-shares-header':
                  section.get('settings', {}).pop('sticky_header', None)
          group_path.write_text(json.dumps(group, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JSON
        run: python -m json.tool sections/header-group.json >/dev/null

      - name: Shopify CLI Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/apply-remove-sticky-dividers-pr.yml
          rm -f .github/workflows/remove-enterprise-header-sticky-dividers.yml

      - name: Commit changes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove Enterprise Shares sticky header and dividers [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
