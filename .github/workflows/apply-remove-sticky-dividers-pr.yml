name: Apply Enterprise Header Cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-remove-sticky-dividers-pr.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove sticky option and header divider lines
        run: |
          python - <<'PY'
          from pathlib import Path

          section_path = Path('sections/enterprise-shares-header.liquid')
          source_lines = section_path.read_text(encoding='utf-8').splitlines()
          output = []
          skip_sticky_css = False

          for line in source_lines:
              if '.esh--sticky {' in line:
                  skip_sticky_css = True
                  continue

              if skip_sticky_css:
                  if line.strip() == '}':
                      skip_sticky_css = False
                  continue

              line = line.replace(
                  '{% if section.settings.sticky_header %} esh--sticky{% endif %}',
                  '',
              )

              if '"id": "sticky_header"' in line:
                  if output and output[-1].rstrip().endswith(','):
                      output[-1] = output[-1].rstrip()[:-1]
                  continue

              if line.strip() in {
                  'border-top: 1px solid var(--color-border);',
                  'border-bottom: 1px solid var(--color-border);',
                  'border-right: 1px solid var(--color-border);',
              }:
                  continue

              output.append(line)

          section_path.write_text('\n'.join(output) + '\n', encoding='utf-8')

          group_path = Path('sections/header-group.json')
          group_lines = group_path.read_text(encoding='utf-8').splitlines()
          group_output = []
          for line in group_lines:
              if '"sticky_header"' in line:
                  if group_output and group_output[-1].rstrip().endswith(','):
                      group_output[-1] = group_output[-1].rstrip()[:-1]
                  continue
              group_output.append(line)
          group_path.write_text('\n'.join(group_output) + '\n', encoding='utf-8')
          PY

      - name: Validate commented Shopify JSON
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path('sections/header-group.json').read_text(encoding='utf-8')
          text = re.sub(r'^\s*/\*.*?\*/\s*', '', text, count=1, flags=re.S)
          json.loads(text)
          PY

      - name: Shopify CLI Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/apply-remove-sticky-dividers-pr.yml
          rm -f .github/workflows/remove-enterprise-header-sticky-dividers.yml

      - name: Commit changes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove Enterprise Shares sticky header and dividers [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
