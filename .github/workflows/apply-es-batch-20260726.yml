name: Apply Enterprise Shares batch update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-es-batch-20260726.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply batch patch
        run: python scripts/apply_es_batch_20260726.py
      - name: Validate generated files
        run: |
          python -m json.tool config/settings_schema.json >/dev/null
          node --check assets/es-header.js
          node --check assets/es-section-carousel.js
          grep -q 'es_kickstarter_layout' sections/header.liquid
          grep -q '_es-header-mega-item' blocks/_header-menu.liquid
          grep -q 'es_media_accent_enable' config/settings_schema.json
          grep -q '手机端菜单字号' sections/header.liquid
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-es-batch-20260726.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply header mega menu and carousel batch update [skip ci]"
          git push
