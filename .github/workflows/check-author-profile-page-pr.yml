name: Check Author Profile Page

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Shopify CLI Theme Check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error

      - name: Remove temporary workflow
        run: rm .github/workflows/check-author-profile-page-pr.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove author profile validation workflow [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
