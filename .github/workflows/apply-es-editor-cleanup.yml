name: Apply ES editor cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-es-editor-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch global product card settings
        run: python scripts/install_es_feature.py
      - name: Validate theme schema
        run: python -m json.tool config/settings_schema.json >/dev/null
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-es-editor-cleanup.yml
      - name: Commit schema update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: clean global product card editor settings [skip ci]"
          git push
